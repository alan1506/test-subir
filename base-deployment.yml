apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboottest
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboottest
  template:
    metadata:
      labels:
        app: springboottest
    spec:
      containers:
      - name: springboottest
        image: 654654328400.dkr.ecr.us-east-2.amazonaws.com/nb/testservicio:latest
        imagePullPolicy: Always
      dnsPolicy: ClusterFirst